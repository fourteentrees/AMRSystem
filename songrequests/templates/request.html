{% include "header.html" %}
<div class="min-h-screen bg-base-200">
	<div class="container mx-auto px-4 py-8">
		<div class="card bg-base-100 shadow-xl">
			<div class="card-body">
				<h1 class="card-title text-3xl">Request a Song</h1>

				<form method="post" class="space-y-6">
					{% csrf_token %}

					<div class="overflow-x-auto">
						<table class="table table-zebra">
							<thead>
								<tr>
									<th></th>
									<th>Title</th>
									<th>Artist</th>
									<th>Album</th>
									<th>Duration</th>
								</tr>
							</thead>
							<tbody>
								{% for song in songs %}
									<tr>
										<th class="w-16">
											<input type="radio" name="song_id" value="{{ song.id }}" class="radio radio-primary" required>
										</th>
										<td>{{ song.title }}</td>
										<td>{{ song.artist }}</td>
										<td>{{ song.album }}</td>
										<td>{{ song.duration }}</td>
									</tr>
								{% empty %}
									<tr>
										<td colspan="5" class="text-center">No songs available.</td>
									</tr>
								{% endfor %}
							</tbody>
						</table>
					</div>
					<fieldset class="fieldset">
	  					<legend class="fieldset-legend">Your name</legend>
	  					<input type="text" class="input" id="requested_by" placeholder="John Songrequester" name="requested_by" required /><br />
  						<p class="label">You'll be credited on-air as this, keep it appropriate.</p>
					</fieldset>

					<div class="card-actions justify-end">
						<button type="submit" class="btn btn-primary">Submit Request</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
